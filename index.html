const imageCache = {};
const FAV_KEY = 'football_favs';
const THEME_KEY = 'football_theme';

/* ===== جلب صورة اللاعب من TheSportsDB ===== */
async function fetchPlayerImage(playerName) {
  const key = playerName.toLowerCase();
  if (imageCache[key] !== undefined) return imageCache[key];

  try {
    const searchName = playerName.split(' ')[0];
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(searchName)}`);
    const data = await res.json();
    if (data.player && data.player.length > 0) {
      const exact = data.player.find(p =>
        p.strPlayer && p.strPlayer.toLowerCase().includes(playerName.split(' ')[0].toLowerCase())
      );
      const target = exact || data.player[0];
      const url = target.strThumb || target.strCutout || target.strRender || null;
      imageCache[key] = url;
      return url;
    }
  } catch (e) {
    console.warn('فشل جلب صورة:', playerName);
  }
  imageCache[key] = null;
  return null;
}

/* ===== حالة التطبيق ===== */
const state = {
  search: '',
  country: '',
  position: '',
  sort: 'default',
  onlyFavs: false
};

let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
let currentModalPlayer = null;

/* ===== تهيئة ===== */
function init() {
  // الوضع الليلي
  const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'dark' ? '🌙' : '☀️';

  // إحصائيات
  document.getElementById('statPlayers').textContent = players.length;
  const countries = new Set(players.map(p => p.country));
  document.getElementById('statCountries').textContent = countries.size;

  // ملء فلتر الدول
  const countrySelect = document.getElementById('countryFilter');
  [...countries].sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    countrySelect.appendChild(opt);
  });

  render();

  // ربط الأحداث
  bindEvents();
}

/* ===== الفلترة والترتيب ===== */
function getFilteredPlayers() {
  let list = [...players];

  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.country.toLowerCase().includes(q) ||
      p.position.toLowerCase().includes(q) ||
      p.clubs.toLowerCase().includes(q)
    );
  }

  if (state.country) list = list.filter(p => p.country === state.country);
  if (state.position) list = list.filter(p => p.position === state.position);
  if (state.onlyFavs) list = list.filter(p => favorites.includes(p.name));

  switch (state.sort) {
    case 'name-asc': list.sort((a,b) => a.name.localeCompare(b.name, 'ar')); break;
    case 'name-desc': list.sort((a,b) => b.name.localeCompare(a.name, 'ar')); break;
    case 'year-asc': list.sort((a,b) => +a.born - +b.born); break;
    case 'year-desc': list.sort((a,b) => +b.born - +a.born); break;
  }

  return list;
}

/* ===== العرض ===== */
function render() {
  const list = getFilteredPlayers();
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';

  document.getElementById('countShown').textContent = list.length;
  document.getElementById('statShowing').textContent = list.length;
  document.getElementById('resetBtn').classList.toggle('show',
    !!(state.search || state.country || state.position || state.onlyFavs || state.sort !== 'default'));

  if (list.length === 0) {
    grid.innerHTML = `<div class="no-results"><span>🔍</span>لا يوجد لاعب مطابق... جرّب تغيير الفلاتر</div>`;
    return;
  }

  list.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.style.animationDelay = `${Math.min(i * 0.025, 1.2)}s`;
    const isFav = favorites.includes(p.name);

    card.innerHTML = `
      <div class="flag-badge">${p.flag}</div>
      <button class="fav-btn ${isFav ? 'active' : ''}" title="إضافة للمفضلة">${isFav ? '❤️' : '🤍'}</button>
      <div class="img-wrap">
        <img src="${FALLBACK}" alt="${p.name}" loading="lazy" data-name="${p.name}">
      </div>
      <div class="card-info">
        <h3>${p.name}</h3>
        <div class="position">⚽ ${p.position}</div>
        <div class="details">
          <span>🌍 ${p.country}</span>
          <span>📅 ${p.born}</span>
        </div>
      </div>
    `;

    // زر المفضلة
    card.querySelector('.fav-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFavorite(p.name);
      render();
    });

    // فتح النافذة
    card.addEventListener('click', () => openModal(p));

    grid.appendChild(card);

    // جلب الصورة
    loadImageFor(p.name, card.querySelector('img'));
  });
}

/* ===== تحميل الصور بشكل غير متزامن ===== */
async function loadImageFor(name, imgEl) {
  const url = await fetchPlayerImage(name);
  if (url && imgEl) {
    imgEl.src = url;
    imgEl.onerror = () => { imgEl.src = FALLBACK; };
  }
}

/* ===== المفضلة ===== */
function toggleFavorite(name) {
  const idx = favorites.indexOf(name);
  if (idx >= 0) favorites.splice(idx, 1);
  else favorites.push(name);
  localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
}

/* ===== فتح النافذة ===== */
async function openModal(p) {
  currentModalPlayer = p;
  const img = document.getElementById('modalImage');
  img.src = FALLBACK;

  document.getElementById('modalName').textContent = p.name;
  document.getElementById('modalTags').innerHTML = `
    <span>${p.flag} ${p.country}</span>
    <span>⚽ ${p.position}</span>
    <span>📅 ${p.born}</span>
  `;
  document.getElementById('modalStory').textContent = p.story;

  const modal = document.getElementById('playerModal');
  modal.classList.add('active');
  document.body.style.overflow = 'hidden';

  const url = await fetchPlayerImage(p.name);
  if (url) img.src = url;
  img.onerror = () => { img.src = FALLBACK; };
}

function closeModal() {
  document.getElementById('playerModal').classList.remove('active');
  document.body.style.overflow = '';
}

/* ===== ربط الأحداث ===== */
function bindEvents() {
  // البحث
  const searchInput = document.getElementById('searchInput');
  const clearSearch = document.getElementById('clearSearch');
  let searchTimer;
  searchInput.addEventListener('input', e => {
    clearTimeout(searchTimer);
    state.search = e.target.value.trim();
    clearSearch.classList.toggle('show', !!state.search);
    searchTimer = setTimeout(render, 200);
  });
  clearSearch.addEventListener('click', () => {
    searchInput.value = '';
    state.search = '';
    clearSearch.classList.remove('show');
    render();
  });

  // الفلاتر
  document.getElementById('countryFilter').addEventListener('change', e => {
    state.country = e.target.value; render();
  });
  document.getElementById('positionFilter').addEventListener('change', e => {
    state.position = e.target.value; render();
  });
  document.getElementById('sortFilter').addEventListener('change', e => {
    state.sort = e.target.value; render();
  });
  document.getElementById('favFilter').addEventListener('click', (e) => {
    state.onlyFavs = !state.onlyFavs;
    e.currentTarget.classList.toggle('active', state.onlyFavs);
    render();
  });

  // إعادة تعيين
  document.getElementById('resetBtn').addEventListener('click', () => {
    state.search = ''; state.country = ''; state.position = '';
    state.sort = 'default'; state.onlyFavs = false;
    searchInput.value = '';
    clearSearch.classList.remove('show');
    document.getElementById('countryFilter').value = '';
    document.getElementById('positionFilter').value = '';
    document.getElementById('sortFilter').value = 'default';
    document.getElementById('favFilter').classList.remove('active');
    render();
  });

  // النافذة
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('playerModal').addEventListener('click', e => {
    if (e.target.id === 'playerModal') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault(); searchInput.focus();
    }
  });

  // الوضع الليلي
  document.getElementById('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
  });

  // لاعب عشوائي
  document.getElementById('randomBtn').addEventListener('click', () => {
    const p = players[Math.floor(Math.random() * players.length)];
    openModal(p);
  });

  // زر العودة
  document.getElementById('toTop').addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  window.addEventListener('scroll', () => {
    const scrollTop = document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    document.getElementById('progressBar').style.width = (scrollTop / height) * 100 + '%';
    document.getElementById('toTop').classList.toggle('show', scrollTop > 400);
  });
}

/* ===== بدء التشغيل ===== */
init();
</script>
